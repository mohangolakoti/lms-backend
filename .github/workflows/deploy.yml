name: Backend Deploy → Railway

# Triggers only on push to main (production branch)
# CI must pass before this workflow is considered (see: needs)
on:
  push:
    branches: [main]

jobs:
  # ── Step 1: Run CI tests first ─────────────────────────────────────────────
  test:
    name: Test (pre-deploy gate)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm run test:ci
        env:
          NODE_ENV: test
          JWT_SECRET: ci-test-access-secret-do-not-use-in-production
          JWT_REFRESH_SECRET: ci-test-refresh-secret-do-not-use-in-production
          JWT_EXPIRE: 1h
          JWT_REFRESH_EXPIRE: 7d
          FRONTEND_URL: http://localhost:3001
          PUPPETEER_SKIP_CHROMIUM_DOWNLOAD: "true"

  # ── Step 2: Deploy to Railway (only if tests pass) ─────────────────────────
  deploy:
    name: Deploy to Railway
    runs-on: ubuntu-latest
    needs: [test]          # ← Only runs if the test job succeeds
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy to Railway
        run: railway up --detach
        env:
          # ★ Add RAILWAY_TOKEN secret in your GitHub repo:
          # Settings → Secrets and variables → Actions → New repository secret
          # Get your token from: railway.app → Account Settings → Tokens
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

      - name: Verify deployment health
        run: |
          echo "Deployment triggered. Railway will build and deploy automatically."
          echo "Monitor progress at: https://railway.app/dashboard"
